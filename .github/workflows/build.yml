name: CI Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.ts'
      - '**.yml'
      - 'package*.json'
  pull_request:
    branches: [ main ]
    paths:
      - '**.ts'
      - '**.yml'
      - 'package*.json'

permissions: read-all

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Build and Test
      id: build
      run: |
        npm ci
        npm run check
        npm run test
        npm run build

